name: Daily X Base Vault Sync

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) to cycle through all 4 batches
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "Which batch to run ('auto' = current 6h window, 'all' = all 60, or 0-3)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - all
          - "0"
          - "1"
          - "2"
          - "3"

jobs:
  sync-bases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Watchlist & Push to Base Vault
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          X_FEED_SOURCE: ${{ secrets.X_FEED_SOURCE }}
          BATCH_MODE: ${{ github.event.inputs.batch || 'auto' }}
        run: node scripts/sync_x_watchlist.mjs
